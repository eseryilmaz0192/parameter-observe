<title>Hat Takip</title>
<style>
/* Layout: Swiss / International Typographic Style — flush-left grid, Helvetica, black rules, one red signal colour; sticky header, stacked rows, fixed bottom tab bar. */
:root{
  --bg:#ffffff; --paper:#f2f2f0; --line:#d9d9d6; --rule:#111111; --ink:#111111; --ink-2:#555552; --ink-3:#8a8a86;
  --red:#e2001a; --red-soft:#fde5e8; --up:#00875a; --down:#e2001a; --band:rgba(17,17,17,.07); --ok:#111111; --stale:#b07600;
  --h1:#e2001a; --h2:#0057b8; --h3:#8a8a86; --h4:#d08c00; --h5:#00875a; --h6:#6b4fbb; --avg:#111111;
  --font:"Helvetica Neue",Helvetica,Arial,"Nimbus Sans",sans-serif;
  --mono:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0b0b; --paper:#171717; --line:#2c2c2c; --rule:#f2f2f0; --ink:#f2f2f0; --ink-2:#a8a8a4; --ink-3:#74746f;
  --red:#ff3347; --red-soft:#3a0f15; --up:#3fcf95; --down:#ff3347; --band:rgba(242,242,240,.09); --ok:#f2f2f0; --stale:#e6b13c;
  --h1:#ff3347; --h2:#5aa2ff; --h3:#9c9c97; --h4:#f0b23a; --h5:#3fcf95; --h6:#a993ff; --avg:#f2f2f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0b; --paper:#171717; --line:#2c2c2c; --rule:#f2f2f0; --ink:#f2f2f0; --ink-2:#a8a8a4; --ink-3:#74746f;
  --red:#ff3347; --red-soft:#3a0f15; --up:#3fcf95; --down:#ff3347; --band:rgba(242,242,240,.09); --ok:#f2f2f0; --stale:#e6b13c;
  --h1:#ff3347; --h2:#5aa2ff; --h3:#9c9c97; --h4:#f0b23a; --h5:#3fcf95; --h6:#a993ff; --avg:#f2f2f0; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.35;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font-family:var(--font)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--rule);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px}
.top .r{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;max-width:720px;margin:0 auto}
.top h1{font-weight:700;font-size:30px;letter-spacing:-.035em;margin:0;line-height:.95;text-transform:none}
.top h1 span{color:var(--red)}
.top .sub{font-size:12px;color:var(--ink-2);margin-top:6px;letter-spacing:.01em}
.top .acts{display:flex;gap:6px;align-items:center}
.iconbtn{background:transparent;color:var(--ink);border:1.5px solid var(--rule);border-radius:0;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn svg{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:1.8}
.iconbtn[aria-expanded="true"]{background:var(--ink);color:var(--bg)}
.btn{font-weight:700;font-size:15px;letter-spacing:.01em;background:var(--ink);color:var(--bg);border:1.5px solid var(--ink);border-radius:0;padding:9px 13px;cursor:pointer;white-space:nowrap;height:38px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
#upBtn{background:var(--red);border-color:var(--red);color:#fff}

/* page */
main{max-width:720px;margin:0 auto;min-height:72vh;touch-action:pan-y;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px;display:grid;gap:28px}
.sheet{display:grid;gap:10px;min-width:0}
.sh-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:2px solid var(--rule);padding-top:8px}
.sh-h h2{font-weight:700;font-size:24px;letter-spacing:-.025em;margin:0;line-height:1.05}
.sh-h .fr{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sh-h .fr.old{color:var(--stale);font-weight:700}
.chips{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border:1.5px solid var(--rule)}
.chips button{flex:1 0 auto;font-weight:700;font-size:13px;letter-spacing:.02em;border:0;border-left:1.5px solid var(--rule);background:transparent;color:var(--ink);border-radius:0;padding:7px 10px;cursor:pointer}
.chips button:first-child{border-left:0}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips i{display:inline-block;width:8px;height:8px;margin-right:5px;vertical-align:0}

/* parameter rows */
.list{border-bottom:1px solid var(--line)}
.prow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto 60px;gap:12px;align-items:center;width:100%;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.prow:first-child{border-top:0}
.prow:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.prow .n{font-weight:700;font-size:16px;letter-spacing:-.01em}
.prow .n small{display:block;font-weight:400;font-size:12px;color:var(--ink-3);margin-top:2px;letter-spacing:0}
.prow .v{text-align:right;font-variant-numeric:tabular-nums}
.prow .v b{font-weight:700;font-size:24px;letter-spacing:-.03em}
.prow .v u{text-decoration:none;font-size:11px;color:var(--ink-3);margin-left:3px}
.prow .v span{display:block;font-size:12px;color:var(--ink-2);margin-top:1px}
.prow .v span.up{color:var(--up);font-weight:700}.prow .v span.dn{color:var(--down);font-weight:700}
.prow svg{width:60px;height:26px;display:block}
.prow svg path{stroke:var(--ink)} .prow svg circle{fill:var(--red)}
.pill{display:inline-block;font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;margin-left:7px;vertical-align:2px;border-radius:0}
.pill.ok{border:1px solid var(--ink-3);color:var(--ink-2)} .pill.bad{background:var(--red);color:#fff}
.detail{border-top:1px solid var(--line);padding:12px 0 14px}
.seg{display:flex;gap:0;flex-wrap:wrap;margin-bottom:10px}
.seg button{font-weight:700;font-size:13px;border:1.5px solid var(--rule);margin-left:-1.5px;background:transparent;color:var(--ink);border-radius:0;padding:5px 11px;cursor:pointer}
.seg button:first-child{margin-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chart{width:100%;height:220px;display:block}
.chart text{font-family:var(--font);font-size:10.5px;fill:var(--ink-3)}
.hatv{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:0;margin-top:10px;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.hatv div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 8px}
.hatv small{display:block;font-size:11px;color:var(--ink-2);letter-spacing:.02em}
.hatv b{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.note{font-size:12px;color:var(--ink-2);margin:6px 0 0}

/* empty, panels */
.empty{border-top:2px solid var(--rule);padding:14px 0 0;display:grid;gap:12px}
.empty h2{font-size:28px;letter-spacing:-.03em;margin:0}
.empty p{margin:0;color:var(--ink-2);max-width:60ch}
.up-panel,.set{border:2px solid var(--rule);padding:16px;display:grid;gap:14px;background:var(--bg)}
.up-panel h2,.set h2{font-size:24px;letter-spacing:-.03em;margin:0}
.drop{display:block;border:1.5px dashed var(--ink);padding:20px 12px;text-align:left;color:var(--ink-2);cursor:pointer;position:relative}
.drop b{display:block;font-size:18px;color:var(--ink);letter-spacing:-.01em;margin-bottom:2px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.msg{font-size:13.5px} .msg.err{color:var(--red)} .msg.ok{color:var(--ink);font-weight:700}
.map{display:grid;gap:6px}
.map label{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:8px;align-items:center;font-size:14px}
.map label span{min-width:0;overflow-wrap:anywhere}
.map small{color:var(--ink-3);font-size:12px}
select{font-family:var(--font);font-size:15px;color:var(--ink);background:var(--bg);border:1.5px solid var(--rule);border-radius:0;padding:5px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools .btn{font-size:14px}
.tools label.btn{display:inline-flex;align-items:center}
.priv{font-size:12.5px;color:var(--ink-2);margin:0}

/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:2px solid var(--rule);display:grid;grid-template-columns:repeat(var(--ntab,6),minmax(0,1fr));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{all:unset;cursor:pointer;text-align:left;padding:9px 6px 10px 8px;font-weight:700;font-size:15px;letter-spacing:-.01em;color:var(--ink-3);position:relative;border-left:1px solid var(--line);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs button:first-child{border-left:0}
nav.tabs button small{display:block;font-weight:400;font-size:10.5px;letter-spacing:.01em;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis}
nav.tabs button[aria-selected="true"]{color:var(--ink)}
nav.tabs button[aria-selected="true"]::before{content:"";position:absolute;top:-2px;left:0;right:0;height:4px;background:var(--red)}
nav.tabs button:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
nav.tabs .dot{display:inline-block;width:6px;height:6px;background:var(--stale);margin-left:3px;vertical-align:3px}

/* dashboard */
.fresh{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:0;border-top:2px solid var(--rule);border-left:1px solid var(--line)}
.fresh button{all:unset;cursor:pointer;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 10px;display:grid}
.fresh button b{font-size:17px;letter-spacing:-.02em}
.fresh button span{font-size:11.5px;color:var(--ink-2)}
.fresh button.old b::after{content:"";display:inline-block;width:7px;height:7px;background:var(--stale);margin-left:5px;vertical-align:2px}
.fresh button.old span{color:var(--stale);font-weight:700}
.fresh button:focus-visible,.find:focus-visible,.dcard:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.find{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:start;width:100%;padding:11px 0;border-top:1px solid var(--line)}
.find:first-child{border-top:0}
.find .tag{font-weight:700;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;padding:3px 5px;text-align:left}
.find.crit .tag{background:var(--red);color:#fff} .find.warn .tag{border:1.5px solid var(--ink);color:var(--ink)}
.find.stale .tag{border:1.5px solid var(--stale);color:var(--stale)} .find.good .tag{background:var(--ink);color:var(--bg)}
.find .tx b{display:block;font-size:15.5px;letter-spacing:-.01em}
.find .tx span{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.find .tx span b{display:inline;font-size:inherit;color:var(--ink)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:0 18px}
.dcard{all:unset;box-sizing:border-box;cursor:pointer;border-top:1px solid var(--rule);padding:10px 0 14px;display:grid;gap:4px;min-width:0}
.dcard .dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.dcard .dh b{font-size:15px;color:var(--ink);letter-spacing:-.01em}
.dcard .dv{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.dcard .dv b{font-size:22px;color:var(--ink);letter-spacing:-.03em}
.dcard .dv i{font-style:normal;color:var(--ink);font-weight:700;margin-left:4px}.dcard .dv i.up{color:var(--up)}.dcard .dv i.dn{color:var(--down)}
.dcard .chart{height:150px}

/* settings */
.set h3{font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 4px;color:var(--ink)}
.set .grp{display:grid;gap:6px;min-width:0;border-top:1px solid var(--rule);padding-top:10px}
.set .help{font-size:12.5px;color:var(--ink-2);margin:0}
.set input[type=text],.set input[type=number],.set select{font-family:var(--font);font-size:15px;color:var(--ink);background:var(--bg);border:0;border-bottom:1.5px solid var(--rule);border-radius:0;padding:6px 2px;width:100%;min-width:0}
.set input:focus-visible,.set select:focus-visible{outline:none;border-bottom-color:var(--red)}
.rowg{display:grid;gap:8px;align-items:center}
.rowg.tab{grid-template-columns:minmax(0,.8fr) minmax(0,.9fr) minmax(0,1.3fr)}
.rowg.spec{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,.7fr) minmax(0,.7fr) 30px}
.rowg.pano{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 30px}
.rowg.head{font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.xbtn{all:unset;cursor:pointer;width:30px;height:30px;text-align:center;color:var(--red);font-size:20px;line-height:30px}
.addbtn{all:unset;cursor:pointer;font-weight:700;font-size:14px;color:var(--red);padding:4px 0;justify-self:start}
.rules{display:grid;gap:4px;font-size:14px}
.rules span{color:var(--ink-3);font-size:12.5px}
body.lock{overflow:hidden}
.ov{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:2px solid var(--rule);padding-bottom:8px}
.ov-t{min-width:0}.ov-t h2{font-size:24px;letter-spacing:-.03em;margin:0;line-height:1.05;overflow-wrap:anywhere}.ov-t span{display:block;font-size:12px;color:var(--ink-2);margin-top:3px}
.ov .seg{margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend button{font-size:13px;font-weight:700;border:1.5px solid var(--rule);background:transparent;color:var(--ink);border-radius:0;padding:4px 9px;cursor:pointer}
.legend button[aria-pressed="false"]{color:var(--ink-3);border-color:var(--line);text-decoration:line-through}
.legend i,.readout i,.keys i{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:0}
.legend button[aria-pressed="false"] i{opacity:.3}
.ov-c{position:relative;flex:none;min-height:260px;height:55vh;touch-action:none;cursor:crosshair}
@media (orientation:landscape) and (max-height:500px){.ov-c{height:72vh}}
.chart.big{width:100%;height:100%}
.chart .mtxt{font-size:11px;font-weight:700}
.cur{position:absolute;width:0;border-left:1.5px solid var(--red);pointer-events:none}
.readout{border-top:1px solid var(--rule);display:grid;gap:2px;font-variant-numeric:tabular-nums}
.readout p{margin:6px 0 2px;font-size:12px;color:var(--ink-2);font-weight:700;letter-spacing:.04em}
.readout div{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:6px;align-items:baseline;font-size:14px;padding:3px 0;border-bottom:1px solid var(--line)}
.readout span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.readout b{font-size:17px;letter-spacing:-.02em}.readout u{text-decoration:none;font-size:11px;color:var(--ink-3);min-width:34px}
.cwrap{cursor:zoom-in;display:block}
.cwrap:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.keys{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2)}
.keys b{color:var(--ink);font-variant-numeric:tabular-nums}
.set.bd{border:0;padding:0}
.hint{font-size:11.5px;color:var(--ink-3);margin:4px 0 0}
@media (prefers-reduced-motion:no-preference){.detail{animation:op .16s ease-out}@keyframes op{from{opacity:.3}}}
</style>

<div lang="tr">
<header class="top">
  <div class="r">
    <div>
      <h1 id="appName">HAT <span>TAKİP</span></h1>
      <div class="sub" id="lastAll">Veri bekleniyor</div>
    </div>
    <div class="acts">
      <button class="iconbtn" id="thBtn" aria-label="Tema: otomatik"></button>
      <button class="iconbtn" id="setBtn" aria-expanded="false" aria-label="Ayarlar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3 5.5 5.5"/></svg></button>
      <button class="btn" id="upBtn" aria-expanded="false">Excel yükle</button>
    </div>
  </div>
</header>

<main id="main">
  <section class="set" id="setPanel" hidden aria-label="Ayarlar"></section>
  <section class="up-panel" id="upPanel" hidden aria-label="Excel yükleme">
    <h2>Excel raporu</h2>
    <label class="drop" for="xFile"><b>Dosya seç</b>Mail/WhatsApp ekini veya Dosyalar'dan .xlsx seçin. Birden çok dosya olabilir.<input id="xFile" type="file" accept=".xlsx,.xls,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" multiple></label>
    <div class="msg" id="xMsg"></div>
    <div class="map" id="mapBox"></div>
    <p class="priv">Excel bu telefonda okunur, veriler ve ayarlar yalnızca bu telefonda saklanır. Telefon değiştirirken ya da uygulamayı silmeden önce yedek alın.</p>
    <div class="tools"><button class="btn ghost" id="bkBtn">Yedek al</button><label class="btn ghost" for="rsFile">Yedekten yükle<input id="rsFile" type="file" accept=".json,application/json" hidden></label><button class="btn danger" id="delBtn">Tüm veriyi sil</button></div>
    <div class="msg" id="bkMsg"></div>
  </section>
  <div id="view"></div>
</main>

<script src="xlsx.full.min.js"></script>
<script>
(function(){
'use strict';
/* ---------- parametreler (genel kimya adları) ---------- */
const PARAMS={
  dens:{n:'Yoğunluk',u:'g/cm³',d:4},
  ta:{n:'TA',u:'%',d:2},
  nacl_gl:{n:'Tuz (NaCl)',u:'g/l',d:1},
  nacl_p:{n:'NaCl',u:'%',d:2},
  naoh:{n:'NaOH',u:'%',d:2},
  na2co3:{n:'Na₂CO₃',u:'%',d:2},
  nahco3:{n:'NaHCO₃',u:'%',d:2},
  debi:{n:'Debi',u:'m³/h',d:0},
  sic:{n:'Sıcaklık',u:'°C',d:1}};
const PORDER=Object.keys(PARAMS);
const HATCOL=['--h1','--h2','--h3','--h4','--h5','--h6'];
const RANGES=[['1g',1],['3g',3],['7g',7],['30g',30],['Tümü',0]];
const NTAB=4;
const DEFCFG={ad:'Hat Takip',sekmeler:[],spek:[],pano:[],grafikler:[],kurallar:[],eskiSaat:12};

const S={db:null,docs:{},map:{},cfg:JSON.parse(JSON.stringify(DEFCFG)),tab:'pano',hat:{},open:null,range:{},draft:null};
try{const t=localStorage.getItem('ht_tab');if(t)S.tab=t;}catch(e){}

/* ---------- yardımcılar ---------- */
const $=id=>document.getElementById(id);
const nowWall=()=>Date.now()-new Date().getTimezoneOffset()*60000;
const p2=n=>String(n).padStart(2,'0');
const fmtT=t=>{const d=new Date(t);return p2(d.getUTCDate())+'.'+p2(d.getUTCMonth()+1)+' '+p2(d.getUTCHours())+':'+p2(d.getUTCMinutes());};
const fmtN=(v,d)=>v==null||!isFinite(v)?'–':v.toLocaleString('tr-TR',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtS=v=>v==null||!isFinite(v)?'':String(+v).replace('.',',');
const ago=t=>{const h=(nowWall()-t)/36e5;if(h<1)return Math.max(1,Math.round(h*60))+' dk önce';if(h<48)return Math.round(h)+' sa önce';return Math.round(h/24)+' gün önce';};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const safeId=s=>String(s).replace(/[^A-Za-z0-9_-]/g,'_').slice(0,60)||'sayfa';
function trLow(s){return String(s==null?'':s).replace(/İ/g,'i').replace(/I/g,'ı').toLowerCase().replace(/\s+/g,' ').trim();}
const words=x=>(Array.isArray(x)?x:String(x||'').split(',')).map(trLow).filter(Boolean);
const wordsTxt=x=>(Array.isArray(x)?x:String(x||'').split(',')).map(s=>String(s).trim()).filter(Boolean).join(', ');
const matchSheet=(sh,kel)=>{const w=words(kel);if(!w.length)return false;const s=trLow(sh);return w.some(x=>s.includes(x));};
const num=v=>{if(v==null||v==='')return null;const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:null;};
const staleH=()=>num(S.cfg.eskiSaat)||12;

/* ---------- sekmeler ---------- */
function sections(){const s=[{k:'pano',n:'Pano',sub:'Özet',dash:true}];
  (S.cfg.sekmeler||[]).slice(0,NTAB).forEach((t,i)=>{if(t&&t.n&&String(t.n).trim())s.push({k:'g'+i,n:String(t.n).trim(),sub:String(t.sub||'').trim(),kel:t.kel});});
  s.push({k:'diger',n:'Diğer',sub:'Kalan'});return s;}
function sectionOf(sh){const sec=sections();if(S.map[sh]&&sec.some(s=>s.k===S.map[sh]&&!s.dash))return S.map[sh];for(const s of sec){if(s.kel&&matchSheet(sh,s.kel))return s.k;}return 'diger';}

/* ---------- Excel okuma ---------- */
function normParam(h){
  const s=trLow(h);if(!s)return null;
  if(/tarih|saat|date|time|numune|açıklama|aciklama|not\b/.test(s))return null;
  if(/yo[ğg]unluk|dens|g\/cm/.test(s))return 'dens';
  if(/bikarbonat|nahco/.test(s))return 'nahco3';
  if(/karbonat|na2co|na₂co/.test(s))return 'na2co3';
  if(/naoh|kostik/.test(s))return 'naoh';
  if(/nacl|tuz/.test(s)){if(/g\s*\/\s*l|gr\s*\/\s*l|g\/lt/.test(s))return 'nacl_gl';if(/%/.test(s))return 'nacl_p';return 'nacl_gl';}
  if(/(^|[^a-zçğıöşü])t\.?\s?a\.?($|[^a-zçğıöşü])|toplam alkal/.test(s))return 'ta';
  if(/debi|m3\/h|m³\/h|akış|akis/.test(s))return 'debi';
  if(/s[ıi]cakl[ıi]k|°c|sıc\./.test(s))return 'sic';
  return null;}
function hatOf(...labels){for(const l of labels){const s=trLow(l);if(!s)continue;
  let m=/(?:hat|h)\s*[-.:#]?\s*(\d)\b/.exec(s)||/(\d)\s*\.?\s*hat/.exec(s)||/-\s*(\d)\s*$/.exec(s);if(m)return 'h'+m[1];}return 't';}
function cellNum(v){if(typeof v==='number')return isFinite(v)?v:null;if(typeof v==='string'){const s=v.trim().replace(/\s/g,'').replace(',','.');if(/^-?\d+(\.\d+)?$/.test(s))return parseFloat(s);}return null;}
function dayMs(v){if(v instanceof Date)return Date.UTC(v.getFullYear(),v.getMonth(),v.getDate());if(typeof v==='number'&&v>20000&&v<80000)return Math.round((Math.floor(v)-25569)*864e5);
  if(typeof v==='string'){const m=/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/.exec(v.trim());if(m){let y=+m[3];if(y<100)y+=2000;return Date.UTC(y,+m[2]-1,+m[1]);}const m2=/^(\d{4})-(\d{2})-(\d{2})/.exec(v.trim());if(m2)return Date.UTC(+m2[1],+m2[2]-1,+m2[3]);}return null;}
function timeMin(v,dateCell){if(v instanceof Date)return v.getHours()*60+v.getMinutes();if(typeof v==='number'&&v<1.0001&&v>=0)return Math.round(v*1440)%1440;
  if(typeof v==='number'&&v>=1&&v<=24&&Number.isInteger(v))return v*60;
  if(typeof v==='string'){const m=/(\d{1,2})[:.](\d{2})/.exec(v);if(m)return (+m[1])*60+(+m[2]);const m2=/^(\d{1,2})$/.exec(v.trim());if(m2)return +m2[1]*60;}
  if(typeof dateCell==='number')return Math.round((dateCell-Math.floor(dateCell))*1440);
  if(typeof dateCell==='string'){const m=/\s(\d{1,2})[:.](\d{2})/.exec(dateCell);if(m)return (+m[1])*60+(+m[2]);}return 0;}

function parseSheet(ws){
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  let hi=-1;for(let r=0;r<Math.min(rows.length,15);r++){if((rows[r]||[]).filter(c=>normParam(c)).length>=1){hi=r;break;}}
  if(hi<0)return {err:'parametre başlığı bulunamadı'};
  const H=rows[hi]||[],G=hi>0?(rows[hi-1]||[]):[],G2=hi>1?(rows[hi-2]||[]):[];
  let dc=H.findIndex(c=>/tarih|date/i.test(String(c||'')));let tc=H.findIndex(c=>/saat|time/i.test(String(c||'')));
  if(dc<0){const r=rows.slice(hi+1).find(r=>r&&r.some(c=>dayMs(c)!=null));if(r)dc=r.findIndex(c=>dayMs(c)!=null);}
  if(dc<0)return {err:'tarih sütunu bulunamadı'};
  let g=null,g2=null;const cols=[];
  for(let i=0;i<Math.max(H.length,G.length);i++){if(G[i])g=String(G[i]);if(G2[i])g2=String(G2[i]);if(i===dc||i===tc)continue;
    const p=normParam(H[i])||(G[i]&&H[i]==null?normParam(G[i]):null);if(!p)continue;cols.push([i,p,hatOf(H[i],g,g2)]);}
  if(!cols.length)return {err:'okunabilir sütun yok'};
  const out=[];let last=null;
  rows.slice(hi+1).forEach(r=>{if(!r)return;let d=dayMs(r[dc]);if(d==null){if(tc>=0&&last!=null&&r[tc]!=null)d=last;else return;}last=d;
    const mn=tc>=0?timeMin(r[tc],r[dc]):timeMin(null,r[dc]);const t=d+mn*60000;const v={};let any=false;
    cols.forEach(([i,p,h])=>{const x=cellNum(r[i]);if(x!=null){(v[p]=v[p]||{})[h]=Math.round(x*1e4)/1e4;any=true;}});
    if(any)out.push({t,v});});
  if(!out.length)return {err:'veri satırı yok'};
  return {rows:out};}

const monthKey=t=>{const d=new Date(t);return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1);};
function merge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])){a[k]=merge(a[k]&&typeof a[k]==='object'?a[k]:{},b[k]);}else a[k]=b[k];}return a;}

async function importFiles(files){
  const msg=$('xMsg');msg.className='msg';msg.textContent='Okunuyor…';
  if(typeof XLSX==='undefined'){msg.className='msg err';msg.textContent='Excel okuyucu yüklenemedi. Uygulamayı kapatıp internete bağlıyken yeniden açın.';return;}
  const parsed={},skipped=[];
  for(const f of files){try{const wb=XLSX.read(new Uint8Array(await f.arrayBuffer()),{type:'array'});
      wb.SheetNames.forEach(sn=>{const r=parseSheet(wb.Sheets[sn]);const name=sn.trim();if(r.err){skipped.push(name+' ('+r.err+')');return;}(parsed[name]=parsed[name]||[]).push(...r.rows);});}
    catch(e){skipped.push(f.name+' (dosya açılamadı)');}}
  const names=Object.keys(parsed);
  if(!names.length){msg.className='msg err';msg.textContent='Okunabilir sayfa bulunamadı. '+skipped.join(', ');return;}
  const writes={};const lines=[];
  names.forEach(sh=>{let nNew=0;const rows=parsed[sh];
    rows.forEach(r=>{const id=safeId(sh)+'_'+monthKey(r.t);const base=writes[id]||JSON.parse(JSON.stringify(S.docs[id]||{sh,ay:monthKey(r.t),rows:{}}));
      const key='t'+r.t;if(!base.rows[key])nNew++;base.rows[key]=merge(base.rows[key]||{},r.v);base.sh=sh;writes[id]=base;});
    lines.push({sh,nNew});});
  msg.textContent='Kaydediliyor…';
  try{const items=Object.entries(writes).map(([id,doc])=>{doc.guncel=nowWall();S.docs[id]=doc;return [id,doc];});await S.db.putMany('olcum',items);
    msg.className='msg ok';
    msg.innerHTML=lines.map(l=>`<b>${esc(l.sh)}</b>: ${l.nNew} yeni ölçüm`).join(' · ')+(skipped.length?`<br><small>Atlanan: ${esc(skipped.join(', '))}</small>`:'');}
  catch(e){msg.className='msg err';msg.textContent=e&&e.name==='QuotaExceededError'?'Telefonda yer kalmadı. Yedek alıp eski verileri silin.':'Kaydedilemedi.';}
  build();renderMap();render();}

/* ---------- sayfa → sekme eşleştirme ---------- */
function renderMap(){const box=$('mapBox');const sheets=[...new Set(Object.values(S.docs).map(d=>d.sh))].sort();
  if(!sheets.length){box.innerHTML='';return;}
  const opts=sections().filter(s=>!s.dash);
  box.innerHTML='<small>Hangi sayfa hangi sekmede görünsün:</small>'+sheets.map((sh,i)=>`<label for="mp${i}"><span>${esc(sh)}</span><select id="mp${i}" data-sh="${esc(sh)}">${opts.map(s=>`<option value="${s.k}"${sectionOf(sh)===s.k?' selected':''}>${esc(s.n)}${s.sub?' · '+esc(s.sub):''}</option>`).join('')}</select></label>`).join('');
  box.querySelectorAll('select').forEach(sel=>sel.onchange=async()=>{S.map[sel.dataset.sh]=sel.value;render();
    try{await S.db.collection('ayar').doc('esles').set({liste:Object.entries(S.map).map(([sh,sec])=>({sh,sec}))});}catch(e){}});}

/* ---------- seriler ---------- */
let SER={};
function build(){SER={};Object.values(S.docs).forEach(d=>{if(!d||!d.sh||!d.rows)return;const o=SER[d.sh]=SER[d.sh]||{rows:{}};Object.entries(d.rows).forEach(([k,v])=>{const t=+k.slice(1);o.rows[t]=merge(o.rows[t]||{},JSON.parse(JSON.stringify(v)));});});
  Object.entries(SER).forEach(([sh,o])=>{o.t=Object.keys(o.rows).map(Number).sort((a,b)=>a-b);
    const ps=new Set(),hs=new Set();o.t.forEach(t=>Object.entries(o.rows[t]).forEach(([p,h])=>{ps.add(p);Object.keys(h).forEach(x=>hs.add(x));}));
    o.taCalc=!ps.has('ta')&&ps.has('na2co3');if(o.taCalc){ps.add('ta');o.t.forEach(t=>{const r=o.rows[t];if(!r.na2co3)return;r.ta={};Object.keys(r.na2co3).forEach(h=>{const c=r.na2co3[h],b=(r.nahco3||{})[h],n=(r.naoh||{})[h];r.ta[h]=Math.round((c+(b||0)*0.6310+(n||0)*1.3250)*1e4)/1e4;});});}
    o.params=PORDER.filter(p=>ps.has(p));o.hats=[...hs].sort();o.last=o.t[o.t.length-1];});}

function series(sh,p,hat){const o=SER[sh];const out={};const hats=hat==='ort'?o.hats:[hat];
  hats.forEach(h=>out[h]=[]);const avg=[];
  o.t.forEach(t=>{const r=o.rows[t][p];if(!r)return;const vals=[];hats.forEach(h=>{if(r[h]!=null){out[h].push([t,r[h]]);vals.push(r[h]);}});if(vals.length)avg.push([t,vals.reduce((a,b)=>a+b,0)/vals.length]);});
  return {lines:out,avg};}

/* spek: ayarlardan (sayfa adı içerir + parametre + min/max) */
function spec(sh,p){const e=(S.cfg.spek||[]).find(x=>x&&x.p===p&&matchSheet(sh,x.sayfa));if(!e)return null;
  const lo=num(e.min),hi=num(e.max);if(lo==null&&hi==null)return null;
  const t=lo!=null&&hi!=null?`${fmtS(lo)}–${fmtS(hi)}`:lo!=null?`≥ ${fmtS(lo)}`:`≤ ${fmtS(hi)}`;
  return {lo:lo==null?-Infinity:lo,hi:hi==null?Infinity:hi,t};}
const inSpec=(sp,v)=>v>=sp.lo&&v<=sp.hi;

/* ---------- çizim ---------- */
function spark(pts){if(pts.length<2)return '<svg aria-hidden="true"></svg>';const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const X=x=>2+(x-x0)/((x1-x0)||1)*60,Y=y=>23-(y-y0)/((y1-y0)||1)*20;const d=pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');const l=pts[pts.length-1];
  return `<svg viewBox="0 0 64 26" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${X(l[0]).toFixed(1)}" cy="${Y(l[1]).toFixed(1)}" r="2.4" fill="var(--red)"/></svg>`;}

/* ---------- grafik motoru ---------- */
const PAL=['--h1','--h2','--h4','--h5','--h6','--h3'];
const lblT=(t,span)=>{const d=new Date(t);return span<2*864e5?p2(d.getUTCHours())+':'+p2(d.getUTCMinutes()):p2(d.getUTCDate())+'.'+p2(d.getUTCMonth()+1);};
function meanOf(a){return a.length?a.reduce((s,x)=>s+x[1],0)/a.length:null;}
/* o: {series:[{name,col,pts,w,mean,u,d}], spec, W, H, dec, norm, big} */
function plot(o){const vis=o.series.filter(s=>s.pts.length);if(!vis.length)return {svg:'<p class="note">Bu aralıkta veri yok.</p>',empty:true};
  const W=o.W,H=o.H,L=o.norm?8:(o.big?52:46),R=o.big?14:8,T=o.big?14:10,B=o.big?26:24;
  vis.forEach(s=>{if(o.norm){const ys=s.pts.map(x=>x[1]);const lo=Math.min(...ys),hi=Math.max(...ys);s.np=s.pts.map(x=>[x[0],(x[1]-lo)/((hi-lo)||1)]);s.nm=m=>(m-lo)/((hi-lo)||1);}else{s.np=s.pts;s.nm=m=>m;}});
  const all=vis.flatMap(s=>s.np);
  let y0=Math.min(...all.map(x=>x[1])),y1=Math.max(...all.map(x=>x[1]));
  const sp=o.norm?null:o.spec;
  if(sp){if(isFinite(sp.lo)){y0=Math.min(y0,sp.lo);y1=Math.max(y1,sp.lo);}if(isFinite(sp.hi)){y0=Math.min(y0,sp.hi);y1=Math.max(y1,sp.hi);}}
  const pad=(y1-y0||Math.abs(y1)*0.02||1)*0.08;y0-=pad;y1+=pad;
  const x0=Math.min(...all.map(x=>x[0])),x1=Math.max(...all.map(x=>x[0]));
  const X=x=>L+(x-x0)/((x1-x0)||1)*(W-L-R),Y=y=>T+(1-(y-y0)/((y1-y0)||1))*(H-T-B);
  let g='';const dec=o.dec==null?2:o.dec;
  if(sp){const a=Y(Math.min(sp.hi,y1)),b=Y(Math.max(sp.lo,y0));if(b>a)g+=`<rect x="${L}" width="${W-L-R}" y="${a.toFixed(1)}" height="${(b-a).toFixed(1)}" fill="var(--band)"/>`;}
  const nY=o.big?5:3;for(let i=0;i<=nY;i++){const v=y0+(y1-y0)*i/nY;const yy=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`+(o.norm?'':`<text x="${L-5}" y="${(yy+3.5).toFixed(1)}" text-anchor="end">${fmtN(v,dec>2?3:dec)}</text>`);}
  const nT=o.big?Math.max(3,Math.min(6,Math.floor(W/90))):3;for(let i=0;i<=nT;i++){const t=x0+(x1-x0)*i/nT;g+=`<text x="${X(t).toFixed(1)}" y="${H-7}" text-anchor="${i===0?'start':i===nT?'end':'middle'}">${lblT(t,x1-x0)}</text>`;}
  vis.forEach(s=>{if(!s.mean)return;const m=meanOf(s.pts);if(m==null)return;const yy=Y(s.nm(m));
    g+=`<line x1="${L}" x2="${W-R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" stroke="${s.col}" stroke-width="1.2" stroke-dasharray="6 4" opacity=".85"/><text class="mtxt" x="${L+4}" y="${(yy-4).toFixed(1)}" text-anchor="start" style="fill:${s.col}">ort. ${fmtN(m,s.d==null?dec:s.d)}</text>`;});
  vis.forEach(s=>{const a=s.np;const d=a.map((x,i)=>(i?'L':'M')+X(x[0]).toFixed(1)+' '+Y(x[1]).toFixed(1)).join('');const l=a[a.length-1];
    g+=`<path d="${d}" fill="none" stroke="${s.col}" stroke-width="${s.w||2}" stroke-linejoin="round"/>`+(a.length<(o.big?80:40)?a.map(x=>`<circle cx="${X(x[0]).toFixed(1)}" cy="${Y(x[1]).toFixed(1)}" r="${o.big?2.2:1.8}" fill="${s.col}"/>`).join(''):'')+`<circle cx="${X(l[0]).toFixed(1)}" cy="${Y(l[1]).toFixed(1)}" r="${o.big?4:3.4}" fill="${s.col}"/>`;});
  const attrs=o.big?`viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"`:`viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"`;
  return {svg:`<svg class="chart${o.big?' big':''}" ${attrs} role="img" aria-label="${esc(o.label||'Zaman grafiği')}">${g}</svg>`,X,Y,L,R,T,B,W,H,x0,x1,vis,inv:px=>x0+(px-L)/((W-L-R)||1)*(x1-x0)};}

/* bir sayfa+parametre için seri listesi (hat çizgileri + ortalama) */
function sheetSeries(sh,p,hat,days,withMean){const S2=series(sh,p,hat);const tEnd=SER[sh].last;const tMin=days?tEnd-days*864e5:-Infinity;const cut=a=>a.filter(x=>x[0]>=tMin);
  const P=PARAMS[p];const lines=Object.entries(S2.lines).map(([h,a])=>({h,a:cut(a)})).filter(l=>l.a.length);const multi=hat==='ort'&&lines.length>1;
  const out=lines.map(l=>({name:hatName(l.h),col:hatColor(l.h),pts:l.a,w:multi?1.4:2.2,u:P.u,d:P.d,mean:withMean&&!multi}));
  if(multi)out.push({name:'Ortalama',col:'var(--avg)',pts:cut(S2.avg),w:2.6,u:P.u,d:P.d,mean:withMean});
  return out;}
function chart(sh,p,hat,days){return plot({series:sheetSeries(sh,p,hat,days,false),spec:spec(sh,p),W:340,H:220,dec:PARAMS[p].d,label:sh+' '+PARAMS[p].n+' zaman grafiği'}).svg;}

/* ---------- büyük grafik ---------- */
let BIG=null,BIGR=null;
function bigData(){const it=BIG.items.filter(x=>SER[x.sh]&&SER[x.sh].params.includes(x.p));if(!it.length)return {series:[]};
  if(it.length===1){const {sh,p,hat}=it[0];return {series:sheetSeries(sh,p,hat||'ort',BIG.range,true),spec:spec(sh,p),dec:PARAMS[p].d,norm:false};}
  const tEnd=Math.max(...it.map(x=>SER[x.sh].last));const tMin=BIG.range?tEnd-BIG.range*864e5:-Infinity;
  const ser=it.map((x,i)=>{const P=PARAMS[x.p];return {name:x.sh+' · '+P.n,col:`var(${PAL[i%PAL.length]})`,pts:series(x.sh,x.p,'ort').avg.filter(q=>q[0]>=tMin),w:2.2,u:P.u,d:P.d,mean:true};});
  const units=new Set(ser.map(s=>s.u));return {series:ser,norm:units.size>1,dec:Math.max(...ser.map(s=>s.d))};}
function openBig(cfg){closeBig();BIG=Object.assign({range:7,hidden:[]},cfg);const ov=document.createElement('div');ov.className='ov';ov.id='ov';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label',cfg.title||'Grafik');
  document.body.appendChild(ov);document.body.classList.add('lock');renderBig();}
function closeBig(){const o=$('ov');if(o)o.remove();document.body.classList.remove('lock');BIG=null;BIGR=null;}
function renderBig(){const ov=$('ov');if(!ov||!BIG)return;const D=bigData();BIG.D=D;const single=BIG.items.length===1;
  ov.innerHTML=`<div class="ov-h"><div class="ov-t"><h2>${esc(BIG.title)}</h2><span>${esc(BIG.sub||'')}</span></div><button class="iconbtn" id="ovX" aria-label="Kapat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="seg" role="group" aria-label="Zaman aralığı">${RANGES.map(([n,d])=>`<button data-brng="${d}" aria-pressed="${BIG.range===d}">${n}</button>`).join('')}</div>
  <div class="legend" role="group" aria-label="Seriler">${D.series.map((s,i)=>`<button data-sx="${i}" aria-pressed="${!BIG.hidden.includes(s.name)}"><i style="background:${s.col}"></i>${esc(s.name)}</button>`).join('')}</div>
  <div class="ov-c" id="ovC"></div>
  <div class="readout" id="ovR"></div>
  <p class="note">${D.norm?'Birimler farklı olduğu için her seri kendi ölçeğinde çizildi; değerleri aşağıdan okuyun. ':''}Kesikli çizgiler seçili aralığın ortalaması. Grafiğe dokunup parmağınızı kaydırarak değer okuyun.</p>
  <div class="tools">${single&&BIG.items[0].sh?`<button class="btn ghost" id="ovGo">Sekmede aç</button>`:''}${BIG.custom!=null?`<button class="btn ghost" id="ovEdit">Düzenle</button>`:''}</div>`;
  $('ovX').onclick=closeBig;
  ov.querySelectorAll('[data-brng]').forEach(b=>b.onclick=()=>{BIG.range=+b.dataset.brng;renderBig();});
  ov.querySelectorAll('[data-sx]').forEach(b=>b.onclick=()=>{const n=D.series[+b.dataset.sx].name;const i=BIG.hidden.indexOf(n);if(i<0)BIG.hidden.push(n);else BIG.hidden.splice(i,1);renderBig();});
  const go=$('ovGo');if(go)go.onclick=()=>{const {sh,p}=BIG.items[0];closeBig();goTo(sectionOf(sh),sh+'|'+p);};

function drawBig(){const c=$('ovC');if(!c||!BIG)return;const D=BIG.D;const ser=D.series.filter(s=>!BIG.hidden.includes(s.name));
  const W=Math.max(260,Math.floor(c.clientWidth)),H=Math.max(200,Math.floor(c.clientHeight));
  BIGR=plot({series:ser.map(s=>Object.assign({},s)),spec:D.spec,W,H,dec:D.dec,norm:D.norm,big:true,label:BIG.title});
  c.innerHTML=BIGR.svg+'<div class="cur" id="ovCur" hidden></div>';readout(null);
  if(BIGR.empty)return;
  const mv=e=>{const r=c.getBoundingClientRect();const px=e.clientX-r.left;if(px<BIGR.L||px>BIGR.W-BIGR.R)return;readout(BIGR.inv(px));};
  c.onpointerdown=e=>{c.setPointerCapture&&c.setPointerCapture(e.pointerId);mv(e);};c.onpointermove=e=>{if(e.pointerType==='mouse'||e.buttons||e.pressure)mv(e);};}
function nearest(a,t){let lo=0,hi=a.length-1;if(hi<0)return null;while(hi-lo>1){const m=(lo+hi)>>1;if(a[m][0]<t)lo=m;else hi=m;}return Math.abs(a[lo][0]-t)<=Math.abs(a[hi][0]-t)?a[lo]:a[hi];}
function readout(t){const R=$('ovR');if(!R||!BIGR)return;const cur=$('ovCur');const vis=BIGR.vis||[];
  let tt=null;if(t!=null){let best=null;vis.forEach(s=>{const n=nearest(s.pts,t);if(n&&(best==null||Math.abs(n[0]-t)<Math.abs(best-t)))best=n[0];});tt=best;}
  if(cur){if(tt==null)cur.hidden=true;else{cur.hidden=false;cur.style.left=BIGR.X(tt).toFixed(1)+'px';cur.style.top=BIGR.T+'px';cur.style.height=(BIGR.H-BIGR.T-BIGR.B)+'px';}}
  const rows=vis.map(s=>{const pt=tt==null?s.pts[s.pts.length-1]:nearest(s.pts,tt);const ok=pt&&(tt==null||Math.abs(pt[0]-tt)<1.5*36e5);
    return `<div><i style="background:${s.col}"></i><span>${esc(s.name)}</span><b>${ok?fmtN(pt[1],s.d):'–'}</b><u>${esc(s.u||'')}</u></div>`;}).join('');
  R.innerHTML=`<p>${tt==null?'Son değerler':fmtT(tt)}</p>`+rows;}

function sheetHtml(sh){const o=SER[sh];const hat=S.hat[sh]&&(S.hat[sh]==='ort'||o.hats.includes(S.hat[sh]))?S.hat[sh]:(o.hats.length>1?'ort':o.hats[0]);

/* ---------- pano ---------- */
const sheetsFor=(kel,p)=>Object.keys(SER).filter(sh=>matchSheet(sh,kel)&&SER[sh].params.includes(p)).sort();
function lastTwo(sh,p){const a=series(sh,p,'ort').avg;return {a,l:a[a.length-1],pr:a.length>1?a[a.length-2]:null};}
const sgn=(d,th)=>d==null?0:d>th?1:d<-th?-1:0;
const ar=d=>d>0?'↑':'↓';

function ruleFindings(){const out=[];
  (S.cfg.kurallar||[]).forEach(r=>{try{
    if(r.tip==='yon'&&r.a&&r.b){const sa=sheetsFor(r.a.sayfa,r.a.p)[0],sb=sheetsFor(r.b.sayfa,r.b.p)[0];if(!sa||!sb)return;
      const A=lastTwo(sa,r.a.p),B=lastTwo(sb,r.b.p);if(!A.pr||!B.pr)return;
      const x=sgn(A.l[1]-A.pr[1],num(r.a.esik)||0),y=sgn(B.l[1]-B.pr[1],num(r.b.esik)||0);if(!x||!y)return;
      const txt=(r.metin||{})[x+','+y];if(!txt)return;let ex='';
      if(r.besleme&&x===y){const sf=sheetsFor(r.besleme.sayfa,r.besleme.p)[0];if(sf){const F=lastTwo(sf,r.besleme.p);if(F.pr&&F.pr[1]){const pc=(F.l[1]-F.pr[1])/F.pr[1]*100;
        if(Math.abs(pc)>=(num(r.besleme.yuzde)||1.5)&&Math.sign(pc)===x)ex=` ${esc(r.besleme.ad||sf)} da ${pc>0?'artmış':'azalmış'} (%${fmtN(Math.abs(pc),1)}); değişimin bir kısmı buradan olabilir.`;}}}
      const da=PARAMS[r.a.p].d,db=PARAMS[r.b.p].d;
      out.push({lvl:r.iyi===x+','+y?4:2,sh:sa,p:r.a.p,t:`${esc(r.a.ad||sa)} ${ar(x)} · ${esc(r.b.ad||sb)} ${ar(y)}`,d:`${esc(r.a.ad||sa)} ${fmtN(A.pr[1],da)} → ${fmtN(A.l[1],da)}, ${esc(r.b.ad||sb)} ${fmtN(B.pr[1],db)} → ${fmtN(B.l[1],db)}. ${esc(txt)}${ex}`});}
    if(r.tip==='patern'&&Array.isArray(r.kosul)&&r.kosul.length){let first=null;
      const ok=r.kosul.every(k=>{const sh=sheetsFor(k.sayfa,k.p)[0];if(!sh)return false;const L=lastTwo(sh,k.p);if(!L.pr)return false;if(!first)first=[sh,k.p];return sgn(L.l[1]-L.pr[1],num(k.esik)||0)===(+k.yon||0);});
      if(ok&&first)out.push({lvl:1,sh:first[0],p:first[1],t:esc(r.ad||'Patern'),d:esc(r.metin||'')});}
  }catch(e){}});return out;}

function findings(){const out=[];const now=nowWall();
  Object.entries(SER).forEach(([sh,o])=>{
    if((now-o.last)/36e5>staleH())out.push({lvl:3,sh,p:null,t:`${esc(sh)} verisi eski`,d:`Son ölçüm ${fmtT(o.last)} (${ago(o.last)}).`});
    o.params.forEach(p=>{const P=PARAMS[p];const {a,l,pr}=lastTwo(sh,p);if(!l)return;
      const sp=spec(sh,p);if(sp&&!inSpec(sp,l[1]))out.push({lvl:1,sh,p,t:`${esc(sh)} ${esc(P.n)} spek dışı`,d:`Son değer <b>${fmtN(l[1],P.d)} ${P.u}</b>, hedef ${sp.t}.`});
      if(a.length>=6&&pr){const ds=[];for(let i=Math.max(1,a.length-21);i<a.length-1;i++)ds.push(a[i][1]-a[i-1][1]);const m=ds.reduce((x,y)=>x+y,0)/ds.length;const sd=Math.sqrt(ds.reduce((x,y)=>x+(y-m)**2,0)/ds.length);const d=l[1]-pr[1];
        if(sd>0&&Math.abs(d)>3*sd)out.push({lvl:2,sh,p,t:`${esc(sh)} ${esc(P.n)} ani ${d>0?'artış':'düşüş'}`,d:`${fmtN(pr[1],P.d)} → <b>${fmtN(l[1],P.d)}</b> ${P.u}; son ölçümlerdeki olağan değişimin 3 katından büyük.`});}
      const row=o.rows[l[0]]&&o.rows[l[0]][p];if(row){const hs=Object.keys(row);if(hs.length>=3){hs.forEach(h=>{const oth=hs.filter(x=>x!==h).map(x=>row[x]).sort((x,y)=>x-y);const md=oth[Math.floor(oth.length/2)];
        if(md&&Math.abs(row[h]-md)/Math.abs(md)>0.25)out.push({lvl:2,sh,p,t:`${esc(sh)} ${hatName(h)} ${esc(P.n)} sapıyor`,d:`${fmtN(row[h],P.d)}, diğer hatlar ~${fmtN(md,P.d)}. Yazım hatası olabilir.`});});}}});});
  return out.concat(ruleFindings()).sort((a,b)=>a.lvl-b.lvl);}

/* ---------- telefonda yerel kayıt (IndexedDB) ---------- */
function idbOpen(name,create){return new Promise((res,rej)=>{let aborted=false;const r=indexedDB.open(name,1);
  r.onupgradeneeded=e=>{if(!create&&e.oldVersion===0){aborted=true;r.transaction.abort();return;}r.result.createObjectStore('docs');};
  r.onsuccess=()=>res(r.result);r.onerror=()=>{if(aborted){try{indexedDB.deleteDatabase(name);}catch(e){}res(null);}else rej(r.error);};r.onblocked=()=>res(null);});}
function idbAll(db){return new Promise((res,rej)=>{const out=[];const rq=db.transaction('docs').objectStore('docs').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out.push([c.key,c.value]);c.continue();}else res(out);};rq.onerror=()=>rej(rq.error);});}
function localDb(){
  let dbp=null;const subs=[];
  const open=()=>dbp||(dbp=(async()=>{const db=await idbOpen('hattakip',true);
    return db;})());
  async function all(col){const db=await open();return new Promise((res,rej)=>{const out=[];const rq=db.transaction('docs').objectStore('docs').openCursor(IDBKeyRange.bound(col+'/',col+'/￿'));
    rq.onsuccess=()=>{const c=rq.result;if(c){const v=c.value;out.push({id:String(c.key).slice(col.length+1),exists:true,data:()=>v});c.continue();}else res(out);};rq.onerror=()=>rej(rq.error);});}
  async function notify(col){for(const s of subs){if(s.col!==col)continue;try{const d=await all(col);if(s.id){s.fn(d.find(x=>x.id===s.id)||{exists:false,data:()=>undefined});}else s.fn({docs:d});}catch(e){s.err&&s.err(e);}}}
  async function write(fn,cols){const db=await open();await new Promise((res,rej)=>{const t=db.transaction('docs','readwrite');fn(t.objectStore('docs'));t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});for(const c of cols)await notify(c);}
  const coll=col=>({
    doc:id=>({set:v=>write(st=>st.put(v,col+'/'+id),[col]),onSnapshot:(fn,err)=>{subs.push({col,id,fn,err});notify(col);}}),
    onSnapshot:(fn,err)=>{subs.push({col,fn,err});notify(col);}});
  return {collection:coll,all,
    putMany:(col,items)=>write(st=>items.forEach(([id,v])=>st.put(v,col+'/'+id)),[col]),
    clearData:()=>write(st=>{const r=st.openCursor();r.onsuccess=()=>{const c=r.result;if(!c)return;if(String(c.key)!=='ayar/config')c.delete();c.continue();};},['olcum','ayar'])};}

$('upBtn').onclick=()=>{const p=$('upPanel');if(p.hidden)openUp();else{p.hidden=true;$('upBtn').setAttribute('aria-expanded','false');$('upBtn').textContent='Excel yükle';}};
$('xFile').onchange=e=>{const f=[...e.target.files];e.target.value='';if(f.length)importFiles(f);};

/* ---------- gündüz / gece ---------- */
const TH_ICON={auto:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor" stroke="none"/></svg>',
  light:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M21.5 12h-2.4M4.9 12H2.5M18.7 5.3l-1.7 1.7M7 17l-1.7 1.7M18.7 18.7 17 17M7 7 5.3 5.3"/></svg>',
  dark:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor" stroke="none"/></svg>'};
const TH_NAME={auto:'otomatik (telefon ayarı)',light:'gündüz',dark:'gece'};
let thMode='auto';try{const m=localStorage.getItem('ht_theme');if(m==='light'||m==='dark')thMode=m;}catch(e){}
function applyTheme(){const r=document.documentElement;if(thMode==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',thMode);
  const dark=thMode==='dark'||(thMode==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
  const mc=$('thColor');if(mc)mc.setAttribute('content',dark?'#0b0b0b':'#ffffff');
  const b=$('thBtn');b.innerHTML=TH_ICON[thMode];b.setAttribute('aria-label','Tema: '+TH_NAME[thMode]);b.title='Tema: '+TH_NAME[thMode];}
$('thBtn').onclick=()=>{thMode={auto:'light',light:'dark',dark:'auto'}[thMode];try{localStorage.setItem('ht_theme',thMode);}catch(e){}applyTheme();render();};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(thMode==='auto')applyTheme();});}catch(e){}
applyTheme();

/* ---------- başlat ---------- */
build();render();
try{
  const db=localDb();S.db=db;
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  db.collection('ayar').doc('config').onSnapshot(s=>{S.cfg=normCfg(s.exists?s.data():null);render();if(!$('upPanel').hidden)renderMap();});
  db.collection('ayar').doc('esles').onSnapshot(s=>{const d=s.exists?s.data():null;S.map={};((d&&d.liste)||[]).forEach(x=>{if(x&&x.sh)S.map[x.sh]=x.sec;});render();if(!$('upPanel').hidden)renderMap();});
  db.collection('olcum').onSnapshot(snap=>{const n={};snap.docs.forEach(d=>{n[d.id]=d.data();});S.docs=n;build();render();if(!$('upPanel').hidden)renderMap();},
    ()=>{$('lastAll').textContent='Kayıtlar okunamadı. Safari ayarlarında web sitesi verisinin silinmediğini kontrol edin.';});
}catch(e){$('lastAll').textContent='Bu tarayıcı yerel kaydı desteklemiyor.';}
setInterval(()=>{if(Object.keys(SER).length)render();},5*60000);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body></html>
